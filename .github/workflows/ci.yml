name: Web and backend checks
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run browser:install
      - run: npm run test:e2e
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: disposable-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MATCHINGSPORTS_RBAC_TEST_CONNECTION: Host=localhost;Port=5432;Database=matchingsports_rbac_test_ci;Username=postgres;Password=disposable-ci-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ./MatchingSports.slnx --locked-mode
      - run: dotnet build ./MatchingSports.slnx --configuration Release --no-restore
      - run: bash ./scripts/test.sh --no-build
      - run: dotnet format ./MatchingSports.slnx --verify-no-changes --no-restore
