name: backend-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet tool restore
      - run: dotnet restore MatchingSports.slnx --locked-mode
      - run: dotnet format MatchingSports.slnx --verify-no-changes --no-restore
      - run: dotnet build MatchingSports.slnx --configuration Release --no-restore
      - run: dotnet test MatchingSports.slnx --configuration Release --no-build --no-restore
      - run: dotnet list MatchingSports.slnx package --vulnerable --include-transitive
