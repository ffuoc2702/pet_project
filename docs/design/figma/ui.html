<!doctype html><html lang="vi"><meta charset="UTF-8"><style>*{box-sizing:border-box}body{font:14px/1.55 system-ui,sans-serif;color:#172b4d;margin:24px}h1{font-size:24px;line-height:1.25}p{color:#52647a}button{border:1px solid #d9e1ea;border-radius:6px;padding:12px 16px;background:white;color:#172b4d;font:600 14px system-ui;cursor:pointer;width:100%;margin:6px 0}#build{background:#1677ff;color:white;border:0}button:disabled{opacity:.5;cursor:default}progress{width:100%;height:12px}#status{padding:12px;background:#e6f4ff;border-radius:6px;white-space:pre-wrap}small{display:block;color:#52647a}</style><h1>MatchingSports<br>84 màn · Desktop & Mobile</h1><p>Tiếp tục trong file MatchingSports đã tạo. Plugin giữ lại các màn đã có, dựng phần còn thiếu và nối các luồng prototype.</p><small>168 frame · 9 nhóm · Layer chữ và component chỉnh sửa được · Không dùng mạng</small><progress id="progress" value="13" max="84"></progress><p id="status">13/84 màn đã được tạo qua MCP.<br>Còn 71 màn cần dựng.</p><button id="build">Dựng các màn còn thiếu</button><button id="export" disabled>Tải mapping và báo cáo kiểm tra</button><button id="close">Đóng</button><script>const build=document.getElementById('build'),exp=document.getElementById('export'),status=document.getElementById('status');build.onclick=()=>{build.disabled=true;parent.postMessage({pluginMessage:{type:'build'}},'*')};exp.onclick=()=>parent.postMessage({pluginMessage:{type:'export'}},'*');document.getElementById('close').onclick=()=>parent.postMessage({pluginMessage:{type:'close'}},'*');onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;if(m.type==='progress'){document.getElementById('progress').value=m.done;status.textContent=m.done+'/'+m.total+' · '+m.screen+'\n'+m.title;}if(m.type==='complete'){const r=m.report;status.textContent='Đã dựng '+r.frames+' frame cho '+r.screens+' màn.\n'+r.prototypeLinks+' liên kết prototype.\n'+r.violations.length+' lỗi cấu trúc phát hiện.\nHãy kiểm tra trực quan trong Figma.';exp.disabled=false;build.disabled=false;}if(m.type==='error'){status.textContent=m.message;build.disabled=false;}if(m.type==='download'){const url=URL.createObjectURL(new Blob([JSON.stringify(m.report,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='matching-sports-figma-report.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}};</script></html>
